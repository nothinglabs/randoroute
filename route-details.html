<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#009E73" />
  <title>Route details · WA Bike Safety</title>
  <link rel="stylesheet" href="route-details.css" />
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Washington Bike Safety</p>
      <h1>Route details</h1>
      <p id="summary" class="summary"></p>
      <p id="optimization" class="route-optimization" hidden></p>
      <p id="mapTapHint" class="tap-hint" hidden>Tap any road, concern, or step to show it on the map.</p>
    </header>

    <section id="panel-concerns" class="detail-panel" role="tabpanel" aria-labelledby="tab-concerns">
      <div id="routeAlert" class="route-alert" hidden></div>
      <div id="report"></div>
    </section>

    <section id="panel-steps" class="detail-panel" role="tabpanel" aria-labelledby="tab-steps" hidden>
      <div id="steps"></div>
    </section>

    <section id="panel-elevation" class="detail-panel" role="tabpanel" aria-labelledby="tab-elevation" hidden>
      <div id="elevationSummary" class="elevation-summary" hidden></div>
      <canvas id="elevationCanvas" hidden></canvas>
      <div id="elevationEmpty" class="no-route" hidden></div>
    </section>

  </main>
  <nav class="detail-bottom-nav" aria-label="Route details navigation">
    <button id="backToMap" class="back" type="button">← Back to map</button>
    <div class="detail-tabs" role="tablist" aria-label="Route details">
      <button type="button" role="tab" id="tab-concerns" aria-controls="panel-concerns" aria-selected="true" data-detail-tab="concerns">Route concerns</button>
      <button type="button" role="tab" id="tab-steps" aria-controls="panel-steps" aria-selected="false" data-detail-tab="steps">Route steps</button>
      <button type="button" role="tab" id="tab-elevation" aria-controls="panel-elevation" aria-selected="false" data-detail-tab="elevation">Elevation</button>
    </div>
  </nav>
  <script src="route-details.js"></script>
</body>
</html>
