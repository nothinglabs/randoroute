<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#009E73" />
  <title>Route details · WA Bike Safety</title>
  <link rel="stylesheet" href="route-details.css" />
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Washington Bike Safety</p>
      <h1>Route details</h1>
      <div id="routeSummaryCard" class="route-summary-card" aria-label="Selected route summary" hidden>
        <div class="route-summary-info">
          <div id="summary" class="route-summary-main"></div>
          <div id="summarySub" class="route-summary-sub"></div>
          <div id="summaryMix" class="route-summary-mix" title="Percent of riding distance; colors match the map legend"></div>
        </div>
        <button id="elevationPreview" class="elevation-preview" type="button" aria-label="Expand elevation chart" hidden>
          <canvas id="elevationPreviewCanvas"></canvas>
          <span>Tap to expand elevation</span>
        </button>
        <div id="elevationPreviewEmpty" class="elevation-preview-empty" hidden>Elevation profile unavailable</div>
      </div>
      <p id="noRouteSummary" class="summary" hidden></p>
      <p id="optimization" class="route-optimization" hidden></p>
      <p id="mapTapHint" class="tap-hint" hidden>Tap any road, concern, or step to show it on the map.</p>
    </header>

    <section id="panel-concerns" class="detail-panel" role="tabpanel" aria-labelledby="tab-concerns">
      <div id="routeAlert" class="route-alert" hidden></div>
      <div id="report"></div>
    </section>

    <section id="panel-steps" class="detail-panel" role="tabpanel" aria-labelledby="tab-steps" hidden>
      <div id="steps"></div>
    </section>

  </main>
  <nav class="detail-bottom-nav" aria-label="Route details navigation">
    <button id="backToMap" class="back" type="button">← Back</button>
    <div class="detail-tabs" role="tablist" aria-label="Route details">
      <button type="button" role="tab" id="tab-concerns" aria-controls="panel-concerns" aria-selected="true" data-detail-tab="concerns">Concerns</button>
      <button type="button" role="tab" id="tab-steps" aria-controls="panel-steps" aria-selected="false" data-detail-tab="steps">Steps</button>
    </div>
  </nav>

  <dialog id="elevationDialog" class="elevation-dialog" aria-labelledby="elevationDialogTitle">
    <div class="elevation-dialog-head"><h2 id="elevationDialogTitle">Elevation</h2><button id="elevationDialogClose" type="button" aria-label="Close elevation chart">✕</button></div>
    <div class="elevation-dialog-body">
      <p id="elevationDialogSummary"></p>
      <canvas id="elevationDialogCanvas"></canvas>
    </div>
  </dialog>
  <script src="route-details.js"></script>
</body>
</html>
