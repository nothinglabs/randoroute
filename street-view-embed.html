<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Street View</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    html, body { overflow: hidden; background: #0b0f13; }
    iframe { display: block; }
    #status {
      position: fixed;
      z-index: 1;
      top: 14px;
      left: 50%;
      max-width: calc(100% - 28px);
      margin: 0;
      padding: 7px 10px;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 8px;
      background: rgba(16,27,35,.88);
      color: #fff;
      font: 700 11px/1.3 system-ui, sans-serif;
      text-align: center;
      white-space: nowrap;
    }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading Street View…</p>
  <iframe id="panorama" title="Google Street View" allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const lat = Number(params.get('lat'));
    const lng = Number(params.get('lng'));
    const heading = Number(params.get('heading'));
    const status = document.getElementById('status');
    const panorama = document.getElementById('panorama');
    const report = (state) => parent.postMessage({ type: 'jra-street-view', state }, '*');

    if (!Number.isFinite(lat) || !Number.isFinite(lng)
      || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
      status.textContent = 'Street View location is invalid.';
      report('error');
    } else {
      const headingParam = Number.isFinite(heading) ? `&heading=${Math.round(heading)}` : '';
      panorama.addEventListener('load', () => {
        status.hidden = true;
        report('ready');
      }, { once: true });
      panorama.src = `https://www.google.com/maps/embed/v1/streetview?key=AIzaSyBQZNQ4jPlLjOH3efOD228wOjayupCfa6Y&location=${lat.toFixed(6)},${lng.toFixed(6)}&radius=250${headingParam}&fov=90`;
    }
  </script>
</body>
</html>
